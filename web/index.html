<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线文件下载</title>
<link rel="shortcut icon" href="/favicon.ico?v=1" type="image/x-icon">
<link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1" sizes="180x180">
<!-- HLS_STYLES --></head><body><div class="app" id="app">
<div class="titlebar"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><div class="tabbar" id="tabbar"><button class="tab-scroll hidden" id="tab-prev" title="向左显示标签"></button><div class="tabs-window" id="tabs-window"><div class="tabs" id="tabs" role="tablist"></div></div><button class="tab-scroll hidden" id="tab-next" title="向右显示标签"></button><button class="new-tab" id="new-tab" title="新建标签页"></button></div><div class="theme-buttons" id="theme-switcher" role="group" aria-label="配色模式"><i class="theme-selection" aria-hidden="true"></i><button id="theme-auto" title="跟随系统" aria-label="系统配色"></button><button id="theme-light" title="白天模式" aria-label="白天配色"></button><button id="theme-dark" title="夜间模式" aria-label="夜间配色"></button></div></div>
<div class="commands"><button id="upload" class="primary"><span class="command-icon">↑</span>上传</button><button id="mkdir" title="新建" aria-label="新建" aria-haspopup="true"><span class="command-icon">+</span>新建</button><span class="separator"></span><button id="download"><span class="command-icon">↓</span>下载</button><button id="rename">重命名</button><button id="delete">删除</button><span class="separator optional"></span><button id="preview-button" class="optional">预览</button><button id="mount-button" class="hidden" title="挂载本地文件夹" aria-label="挂载本地文件夹"></button><button id="more-button" title="更多操作" aria-label="更多操作"></button><button id="records-button" title="下载记录" aria-label="下载记录" class="right"><span class="command-icon">≡</span>下载记录</button></div>
<div class="navigation"><div class="nav-buttons"><button id="back" title="后退">←</button><button id="forward" title="前进">→</button><button id="up" title="上一级">↑</button></div><div class="address" id="address"><span class="address-mark">▣</span><div class="crumbs" id="crumbs"></div><button class="folder-dropdown" id="folder-dropdown" title="同级文件夹" aria-label="同级文件夹">⌄</button><input class="path-input hidden" id="path-input" aria-label="目录路径" spellcheck="false"></div><div class="search"><span class="glass">⌕</span><input id="search" placeholder="在此目录中查找" aria-label="搜索文件"><button id="clear-search" title="清除搜索">×</button></div></div>
<div class="workspace"><aside class="sidebar"><div class="sidebar-label">位置</div><button class="sideitem active" id="home" title="共享目录" aria-label="共享目录"><b>⌂</b><span>共享目录</span></button><button class="sideitem hidden" id="own" title="我的文件夹" aria-label="我的文件夹"><b>▣</b><span>我的文件夹 <small>可管理</small></span></button><button class="sideitem" id="side-records" title="下载记录" aria-label="下载记录"><b>↓</b><span>下载记录</span></button><div class="connection"><button id="p2p-sender" class="p2p-sender hidden" type="button" aria-pressed="true">PCDN · 开启</button><button id="host-settings" class="host-settings hidden" title="设置" aria-label="设置"></button><div class="connected" id="connection">正在连接</div><div>访问 IP <strong id="client-ip">—</strong></div><div class="permission" id="permission"></div></div></aside>
<main class="main" id="main"><div class="heading"><div class="heading-icon">▱</div><h1 id="heading">在线文件下载</h1><p id="subtitle"></p><div class="view-tools"><button id="refresh" title="刷新">↻</button><button id="list-view" class="active" title="列表布局">☰</button><button id="grid-view" title="网格布局">▦</button></div></div><div class="directory-update hidden" id="directory-update" role="status"><span id="directory-update-label">此目录有更新</span><button id="directory-update-refresh">刷新</button></div><div class="table-head"><button class="col-name" data-sort="name">名称</button><button class="col-date" data-sort="modified">修改日期</button><button class="col-type" data-sort="type">类型</button><button class="col-size" data-sort="size">大小</button></div><div class="viewport" id="viewport" tabindex="0"><div class="spacer" id="spacer"></div><div class="empty hidden" id="empty"><div class="empty-icon">▱</div><span id="empty-text"></span></div></div></main>
<aside class="drawer hidden" id="drawer"><div class="drawer-head"><span id="drawer-title">下载记录</span><button id="close-drawer" title="关闭侧栏">×</button><button id="clear-records">清除</button></div><div class="records" id="records"></div><div class="preview hidden" id="preview"></div></aside></div>
<div class="statusbar"><span id="count">正在连接…</span><span class="right"><span class="mode" id="write-mode"></span><span id="selection-info">在线文件下载</span></span></div><div class="toast hidden" id="toast" role="status"></div><input type="file" id="file-input" class="hidden" multiple><input type="file" id="folder-input" class="hidden" webkitdirectory directory multiple><div class="upload-status hidden" id="upload-status"><button id="cancel-upload">取消</button><span id="upload-label"></span><div class="upload-track"><i id="upload-progress"></i></div></div><div class="modal-shade hidden" id="modal-shade"><div class="modal" role="dialog" aria-modal="true"><h2 id="modal-title"></h2><div class="modal-copy" id="modal-text"></div><input id="modal-input"><div class="modal-actions" id="modal-actions"></div></div></div><div class="context hidden" id="context"></div><div class="folder-menu hidden" id="folder-menu"></div><div class="site-notice hidden" id="site-notice"><div class="notice-copy"><strong id="notice-title"></strong><p id="notice-message"></p></div><div id="attention-files" class="attention-files hidden" role="group" aria-label="主机关注文件"></div><button id="dismiss-notice" title="收起公告">×</button></div><div class="zip-status hidden" id="zip-status" role="status"><div><strong id="zip-title"></strong><button id="cancel-zip">取消</button></div><p id="zip-message"></p><div class="zip-track"><i id="zip-progress"></i></div></div><section class="p2p-status hidden" id="p2p-status" aria-label="下载进度"><div class="p2p-heading"><strong id="p2p-title"></strong><button id="p2p-pause">暂停</button><button id="p2p-cancel">取消</button></div><p id="p2p-message"></p><div class="p2p-track"><i id="p2p-progress" role="progressbar" aria-label="文件下载进度" aria-valuemin="0" aria-valuemax="100"></i></div></section><div class="settings-shade hidden" id="settings-shade"><section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title"><header><div><small>主机管理</small><h2 id="settings-title">设置</h2></div><button id="close-settings" title="关闭设置"></button></header><form id="settings-form"><div class="settings-grid"><label>登录口令<input id="setting-password" type="password" maxlength="1024" autocomplete="new-password" placeholder="留空保持现有口令"><small id="password-state"></small></label><label class="clear-password"><input id="setting-clear-password" type="checkbox">取消登录口令</label><label>防盗链空闲等待（秒）<input id="setting-hotlink" type="number" min="0" max="86400"><small>0 关闭；传输期间持续续期</small></label><label>共享名称<input id="setting-title" maxlength="128"></label><label>写入权限<select id="setting-write"><option value="readonly">只读</option><option value="isolated">独立 IP 目录</option><option value="shared">共享写入</option></select></label><label>同时访问的 IP 上限<input id="setting-ip" type="number" min="0" max="1000000"><small>0 表示不限制</small></label><label>独立目录上限<input id="setting-owner" type="number" min="0" max="1000000"></label><label>每 IP 累计上传额度<span class="quota-inputs"><input id="setting-ip-upload" type="number" min="0" max="1073741824" aria-label="每 IP 累计上传额度数值"><select id="setting-ip-upload-unit" aria-label="上传额度单位"><option value="mb">MB</option><option value="gb">GB</option></select></span><small>0 不限制；重启后保留累计接收量</small></label><label>ZIP 压缩包预览<select id="setting-zip-preview"><option value="off">关闭（默认）</option><option value="host">主机按需提供</option><option value="client">下载后由浏览器提供</option></select><small>主机模式会占用主机解压资源；两种模式均有安全上限</small></label><label>关注胶囊点击动作<select id="setting-attention-click"><option value="locate">定位文件</option><option value="download">直接下载</option></select></label><label>单文件上传上限（MiB）<input id="setting-upload" type="number" min="1" max="1048576"></label><label>每页 PCDN 缓存上限（MiB）<input id="setting-p2p-cache" type="number" min="0" max="64"><small>所有文件共用；0 不保留缓存</small></label><label>PCDN 缓存空闲有效期（秒）<input id="setting-p2p-expiry" type="number" min="1" max="86400"><small>默认 3600；核实分发或实际传输时续期</small></label><div class="setting-checks"><label><input id="setting-preview" type="checkbox">允许文件预览</label><label><input id="setting-thumbnails" type="checkbox">预览后生成缩略图（仅客户端内存）</label><label><input id="setting-magika" type="checkbox">Magika 内容识别</label><label><input id="setting-mcp" type="checkbox">本机 MCP 入口</label><label><input id="setting-p2p" type="checkbox">PCDN 总开关（发送与 P2P 下载）</label></div></div><label>按 IP 单独设置上传额度<textarea id="setting-ip-upload-overrides" rows="2" placeholder="192.168.1.8=5GB&#10;192.168.1.9=512MB"></textarea><small>一行一个 IP；0 表示该 IP 不限制，留空使用统一额度</small></label><label>公告<textarea id="setting-announcement" rows="3" maxlength="4096" placeholder="向访问者展示的消息"></textarea></label><section class="access-review settings-review"><strong>登录封禁 IP</strong><button type="button" id="reload-blocked">刷新列表</button><div id="blocked-ips"></div></section><section class="name-review-panel settings-review"><strong>姓名审核</strong><button type="button" id="reload-name-reviews">刷新申请</button><div id="name-reviews"></div></section><div class="mcp-setup"><strong>MCP 连接信息</strong><p>只允许本机访问，提供只读文件工具。</p><label>入口<input id="mcp-url" readonly></label><label>Bearer Token<input id="mcp-token" type="password" readonly autocomplete="off"></label><button type="button" id="copy-mcp">复制连接配置</button><button type="button" id="reveal-mcp">显示令牌</button></div><p class="settings-hint">修改在当前运行中即时生效。监听地址、端口和工作线程预算通过 CLI 设置。</p><div id="settings-error" role="alert"></div><footer><button type="button" id="cancel-settings">取消</button><button type="submit" class="primary" id="save-settings">应用设置</button></footer></form></section></div></div>
<!-- HLS_SCRIPTS --></body></html>
