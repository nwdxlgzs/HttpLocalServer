<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>文件预览 · HttpLocalServer</title><link rel="stylesheet" href="/_hls/preview-assets/viewer.css"></head><body>
<header class="viewer-header"><span class="format" id="format">预览</span><strong id="name"></strong><button id="browse-zip" class="hidden" title="压缩包目录">目录</button><button id="edit" class="hidden">编辑</button><button id="save" class="hidden">保存</button><button id="find-toggle" title="查找" aria-label="查找" aria-expanded="false"><svg class="viewer-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><button id="copy" title="复制选中文字">复制</button><button id="download" title="下载原文件">下载</button></header>
<nav class="document-tools" id="tools" aria-label="文档工具栏">
<div class="tool-group page-tools"><button id="prev" title="上一页" aria-label="上一页">‹</button><input id="page" type="number" min="1" value="1" aria-label="页码"><span id="counter">/ 1</span><button id="next" title="下一页" aria-label="下一页">›</button></div>
<div class="tool-group zoom-tools"><button id="zoom-out" title="缩小" aria-label="缩小">−</button><span id="zoom">100%</span><button id="zoom-in" title="放大" aria-label="放大">＋</button><select id="fit" aria-label="页面缩放方式"><option value="width">适合宽度</option><option value="page">适合页面</option><option value="actual">实际大小</option><option value="custom" disabled>自定缩放</option></select></div>
<div class="tool-group presentation-tools hidden" id="presentation-tools"><button id="slides-toggle" aria-label="幻灯片导航" aria-expanded="true" title="幻灯片导航"></button><button id="present" title="从当前页放映（F5）"></button><button id="auto-play" title="自动播放" aria-pressed="false"></button><select id="slide-interval" aria-label="自动播放间隔"><option value="3">3 秒</option><option value="5" selected>5 秒</option><option value="10">10 秒</option><option value="15">15 秒</option><option value="30">30 秒</option></select></div>
<div class="tool-group find-tools"><input id="find" placeholder="查找" aria-label="查找文字"><button id="find-next" title="查找下一处">查找</button></div>
</nav>
<div class="viewer-content" id="content"><aside class="zip-sidebar hidden" id="zip-sidebar"><div id="zip-path" class="zip-path"></div><div id="zip-list" class="zip-list"><div id="zip-spacer"></div></div></aside><main id="stage" class="stage" aria-busy="true"></main><div class="viewer-loading" id="loading" role="status"><i></i><span>正在打开…</span></div></div>
<div class="viewer-snackbar" id="status" role="status" aria-live="polite" aria-atomic="true"></div><div id="viewer-menu" class="viewer-menu hidden"></div><script src="/_hls/preview-assets/compat.js"></script><script src="/_hls/preview-assets/app.js"></script><script src="/_hls/preview-assets/interactions.js"></script></body></html>
